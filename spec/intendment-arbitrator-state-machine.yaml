# IntendmentArbitrator: structured specification data.
# Source for the transition, reserve-operation and invariant tables in
# intendment-arbitrator-state-machine.md (rendered by render.py; `render.py check`
# fails when the two drift; `render.py validate` checks the data itself) and the
# seed for property-test fixtures (`render.py fixtures`). Prose, rationale,
# modes and host profiles live in the .md. Not yet an executable model.
spec: IntendmentArbitrator state machine
version: "0.4"
date: 2026-09-04
normative_for: ../docs/intendment-design-v0.8.md, stage 1 (1a and 1b)

symbols:
  q: the epoch quote; the escrow (`fee`) of every case in the epoch; F_A = F_B = q
  c: the real arbitrator K's cost at the moment of forwarding
  pi: the capacity premium, q * premiumBps / 10000, retained by the pool on every settled case; zero in the pilot
  x: a fee share, the wrapper's only price unit, 0 <= x <= q - pi; the requester's net loss on a concession is D + pi + x
  W: the window; deadline = createdAt + W
  G: the funding period after the deadline; fundingEnd = deadline + G
  V: the minimum validity of a bid; a bid is live while now < bidValidUntil, so none is live at the deadline
  earmark: the part of the reserve set aside for one case at creation, min(maxCost - q, free)
  reserve: principal + surplus, the wrapper's balance beyond fees, unclaimed funding and claimable credits
  free: reserve minus the sum of earmarks
  funding: totalFunding of a case, stored by funders during the funding period; fundingUsed is what forwarding consumed
  refundableFraction: (totalFunding - fundingUsed) / totalFunding, stored once at the case's end; 1 on lapse or concession
  covered(id): c <= fee + earmark + free + (totalFunding - fundingUsed), evaluated live
  resolverFailed(id): firstForwardFailure != 0 and now >= firstForwardFailure + RESOLVER_GRACE

events:
  - EpochRegistered
  - MetaEvidence
  - CaseOpened
  - UnderInsured
  - CaseBound
  - AskSet
  - BidPosted
  - Settled
  - Escalated
  - ForwardFailed
  - Funded
  - FundingClaimed
  - Lapsed
  - RulingRelayed
  - Claimed
  - ReserveFunded
  - Deactivated
  - WithdrawalAnnounced
  - WithdrawalCancelled
  - PrincipalWithdrawn
  - SurplusMigrated

states:
  - id: Unbound
    meaning: the host has called createDispute; the request kind and parties are not yet known
  - id: Open
    meaning: a registration request under challenge; settlement open
  - id: Forwardable
    meaning: a removal request under challenge; no settlement, waiting to be forwarded
  - id: Forwarded
    meaning: the dispute exists on K; the wrapper passes rulings and appeals through
  - id: Conceded
    meaning: terminal; the requester conceded; the host received the challenger-wins ruling
  - id: Lapsed
    meaning: terminal; the emergency path; the host received the refusal ruling

transitions:
  - id: T1
    move: createDispute(choices, extraData) payable
    from: []
    to: [Unbound]
    who: the host, fixed at deployment
    stage: 1a
    pre:
      - msg.sender == HOST
      - the envelope decodes to a registered epoch and msg.value == its quote
      - never conditioned on the reserve
    money:
      - escrow fee = msg.value
      - earmark = min(maxCost - q, free)
    events: [CaseOpened, "UnderInsured?"]

  - id: T2
    move: bind(id)
    from: [Unbound]
    to: [Open, Forwardable]
    who: anyone; implied by the first party move
    stage: 1a
    pre:
      - the host has stored its dispute mapping for id
    money: []
    events: [CaseBound]

  - id: T3
    move: forward(id)
    from: [Forwardable]
    to: [Forwarded]
    who: anyone; the removal requester's interest; a router bundles it with the challenge
    stage: 1a
    pre:
      - covered(id)
    money:
      - c to K from fee, then earmark, then free, then funding; fundingUsed and refundableFraction recorded
      - fee - c, if positive, to surplus; unused earmark to free
      - if K reverts, nothing moves and firstForwardFailure is recorded
    events: [Escalated, "ForwardFailed?"]

  - id: T4
    move: setAsk(id, x)
    from: [Open]
    to: [Open, Conceded]
    who: challenger
    stage: 1b
    pre:
      - now < deadline
      - first call 0 <= x <= q - pi; later calls x < ask
    money:
      - none; if a live bid >= x exists, executes T7 at the bid
    events: [AskSet, "Settled?"]

  - id: T5
    move: concede(id, maxShare)
    from: [Open]
    to: [Conceded]
    who: requester
    stage: 1a
    pre:
      - ask <= maxShare
    money:
      - claimable A += q - pi - ask; claimable B += ask; surplus += pi; earmark to free; refundableFraction = 1
      - then host.rule(id, CHALLENGER_WINS)
    events: [Settled]

  - id: T6
    move: bid(id, x, validUntil)
    from: [Open]
    to: [Open, Conceded]
    who: requester
    stage: 1b
    pre:
      - now < deadline
      - x > highest bid so far; x <= q - pi
      - validUntil >= now + V; validUntil <= deadline
    money:
      - none; if x >= ask, executes T5 at the ask
    events: [BidPosted, "Settled?"]

  - id: T7
    move: acceptBid(id, minShare)
    from: [Open]
    to: [Conceded]
    who: challenger
    stage: 1b
    pre:
      - bid live; bid >= minShare
    money:
      - claimable A += q - pi - bid; claimable B += bid; surplus += pi; earmark to free; refundableFraction = 1
      - then host.rule(id, CHALLENGER_WINS)
    events: [Settled]

  - id: T8
    move: escalate(id)
    from: [Open]
    to: [Forwarded]
    who: requester
    stage: 1a
    pre:
      - now < deadline
      - no live bid
      - covered(id)
    money:
      - as T3
    events: [Escalated, "ForwardFailed?"]

  - id: T9
    move: escalate(id)
    from: [Open]
    to: [Forwarded]
    who: anyone, the challenger included
    stage: 1a
    pre:
      - now >= deadline, so no offer is live
      - covered(id)
    money:
      - as T3
    events: [Escalated, "ForwardFailed?"]

  - id: T10
    move: fund(id) payable
    from: [Open, Forwardable]
    to: [Open, Forwardable]
    who: anyone
    stage: 1a
    pre:
      - now < fundingEnd
    money:
      - totalFunding += msg.value; contribution[msg.sender] += msg.value
    events: [Funded]

  - id: T11
    move: lapse(id)
    from: [Open, Forwardable]
    to: [Lapsed]
    who: anyone
    stage: 1a
    pre:
      - now >= fundingEnd
      - not covered(id), or resolverFailed(id)
    money:
      - claimable B += q; refundableFraction = 1; earmark to free
      - then host.rule(id, REFUSE)
    events: [Lapsed]

  - id: T12
    move: rule(kDisputeID, ruling)
    from: [Forwarded]
    to: [Forwarded]
    who: K only
    stage: 1a
    pre:
      - at most once per K ruling
    money:
      - none held; host.rule(id, ruling)
    events: [RulingRelayed]

  - id: T13
    move: appeal(id, extraData) payable
    from: [Forwarded]
    to: [Forwarded]
    who: the host only, from its own appeal crowdfunding
    stage: 1a
    pre:
      - msg.sender == HOST
      - K's appeal period open
    money:
      - msg.value to K.appeal(kDisputeID, epoch real extra data) in the same transaction
    events: []

  - id: T14
    move: claim(to)
    from: [Unbound, Open, Forwardable, Forwarded, Conceded, Lapsed]
    to: [Unbound, Open, Forwardable, Forwarded, Conceded, Lapsed]
    who: any creditor, for its own claimable balance
    stage: 1a
    pre:
      - claimable[msg.sender] > 0
    money:
      - claimable[msg.sender] to `to`; the only value transfer to a party in the contract
    events: [Claimed]

  - id: T15
    move: claimFunding(id)
    from: [Forwarded, Conceded, Lapsed]
    to: [Forwarded, Conceded, Lapsed]
    who: a funder of the case, once
    stage: 1a
    pre:
      - contribution[msg.sender] > 0 and not yet claimed
    money:
      - claimable[msg.sender] += contribution * refundableFraction; rounding dust stays in surplus
    events: [FundingClaimed]

reserve_operations:
  - id: G1
    move: registerEpoch(realExtraData, marginBps, premiumBps, maxCost)
    who: governor, while not retired
    pre:
      - marginBps <= MAX_MARGIN_BPS; premiumBps <= MAX_PREMIUM_BPS
      - maxCost >= quote
    effect:
      - quote = K.arbitrationCost(realExtraData) * (10000 + marginBps) / 10000, fixed forever; pi = quote * premiumBps / 10000
      - emits the epoch's MetaEvidence pair
    events: [EpochRegistered, MetaEvidence]
  - id: G2
    move: fundReserve() payable
    who: anyone
    pre: []
    effect:
      - from the governor, principal += msg.value; from anyone else, surplus += msg.value, a gift
    events: [ReserveFunded]
  - id: G3
    move: deactivate()
    who: governor
    pre:
      - not retired
    effect:
      - retired = true; retiredAt = now; no epoch can be registered afterwards
    events: [Deactivated]
  - id: G4
    move: announceWithdrawal(amount, to)
    who: governor
    pre:
      - retired; amount <= principal
    effect:
      - pending = {amount, to, announcedAt = now}
    events: [WithdrawalAnnounced]
  - id: G5
    move: cancelWithdrawal()
    who: governor
    pre:
      - a pending announcement exists
    effect:
      - pending cleared
    events: [WithdrawalCancelled]
  - id: G6
    move: executeWithdrawal()
    who: governor
    pre:
      - pending; now >= announcedAt + RESERVE_TIMELOCK
      - now >= retiredAt + RETIREMENT_LOCK, where RETIREMENT_LOCK >= the host's challenge period plus a margin
      - no case in Unbound, Open or Forwardable; amount <= free
    effect:
      - principal -= amount; free -= amount; paid to `to`
    events: [PrincipalWithdrawn]
  - id: G7
    move: migrateSurplus(successor)
    who: governor
    pre:
      - retired; now >= retiredAt + RETIREMENT_LOCK; no case in Unbound, Open or Forwardable
      - successor was deployed by the same factory for the same host
    effect:
      - the whole surplus moves to the successor as its surplus
    events: [SurplusMigrated]

invariants:
  - id: I1
    name: conservation
    text: balance == sum of open fees + sum of unclaimed funding + sum of claimable + reserve, and reserve == principal + surplus, and free == reserve - sum of earmarks, after every transition
  - id: I2
    name: one-time finalization
    text: exactly one of T3, T5, T7, T8, T9, T11 executes per case; T12 at most once per K ruling; T15 at most once per funder per case
  - id: I3
    name: quote stability
    text: F_A == F_B == q for every case of an epoch; a quote and its premium never change after registration
  - id: I4
    name: no holdup
    text: the requester can always execute T5 at the current ask before forwarding; the ask is set at most once upward, to at most q - pi, and then only falls
  - id: I5
    name: case-level offer binding
    text: a live bid blocks T8; no offer is live at or after the deadline; T8 exists only before the deadline and T9 only from it, so they are disjoint
  - id: I6
    name: passivity, by mode
    text: for an insured case a silent challenger is conceded to at x = 0, a silent requester reaches court at the deadline through T9, and a silent removal is forwarded by anyone; for an under-insured case court depends on free reserve or funding and T11 is possible after the funding period
  - id: I7
    name: deposit neutrality
    text: the wrapper never reads, holds or moves a deposit; its prices are fee shares
  - id: I8
    name: emergency isolation
    text: T11 is unreachable while covered(id) holds and K accepts disputes; an insured case is covered for every c <= maxCost
  - id: I9
    name: failure-safe payouts
    text: no transition other than T14 transfers value to a party; a reverting receiver cannot block any transition
  - id: I10
    name: no refusal of challenges
    text: T1 reverts only for a wrong sender, an unregistered epoch or a wrong value, never for the state of the reserve
  - id: I11
    name: fixed price
    text: the challenger's economic fee on every forwarded case is q; the reserve absorbs q - c in either direction
  - id: I12
    name: exclusivity at fundingEnd
    text: for now >= fundingEnd, escalation needs covered(id) and lapse needs its negation, so absent a resolver failure exactly one of them is satisfiable at any instant; after resolverFailed(id) both may be, which is the disclosed emergency
  - id: I13
    name: constant cost
    text: no transition iterates over funders, cases or epochs; funder refunds are computed lazily per funder from one stored fraction
  - id: I14
    name: host-only appeal
    text: K.appeal is reached only through T13, and T13 only from the host, so the host's appeal crowdfunding is never bypassed
  - id: I15
    name: principal and surplus
    text: surplus leaves the wrapper only to a successor of the same factory after retirement; principal leaves only after retirement, the retirement lock and the timelock, with no case open
  - id: I16
    name: non-upgradeable
    text: the wrapper is a plain contract, no proxy and no admin; nothing changes its behavior after deployment except registered epochs and retirement
